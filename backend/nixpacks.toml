[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = [
    "npm ci --include=optional",
    "rm -rf node_modules/sharp node_modules/@img",
    "npm install --os=linux --cpu=x64 sharp",
    "npm rebuild @swc/core"
]

[phases.build]
cmds = ["echo 'Skipping admin panel build - API only deployment'"]

[start]
cmd = "npm run develop"

[variables]
NODE_ENV = "production"
PORT = "1337"
